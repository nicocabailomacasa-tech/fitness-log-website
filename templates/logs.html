{% extends 'base.html' %}
{% block title %}Add Workout{% endblock %}

{% block content %}
<div class="panel wide-panel">
    <h2>{% if edit_mode %}Edit Workout{% else %}Add New Workout{% endif %}</h2>
    <form method="POST" action="{% if edit_mode %}{{ url_for('edit_log', log_id=log[0]) }}{% else %}{{ url_for('add_log') }}{% endif %}">
        <div class="form-grid">
            <div class="form-group">
                <label for="activity_name">Activity Name</label>
                <input type="text" id="activity_name" name="activity_name" value="{{ log[1] if edit_mode else '' }}" required>
            </div>

            <div class="form-group">
                <label for="exercise_type">Exercise Type</label>
                <select id="exercise_type" name="exercise_type" required>
                    {% set types = ['Cardio', 'Strength', 'Flexibility', 'HIIT', 'Walking', 'Running', 'Cycling', 'Yoga', 'Other'] %}
                    {% for type in types %}
                        <option value="{{ type }}" {% if edit_mode and log[2] == type %}selected{% endif %}>{{ type }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="duration_minutes">Duration (minutes)</label>
                <input type="number" id="duration_minutes" name="duration_minutes" min="1" value="{{ log[3] if edit_mode else '' }}" required>
            </div>

            <div class="form-group">
                <label for="calories_burned">Calories Burned</label>
                <input type="number" step="0.01" id="calories_burned" name="calories_burned" min="0" value="{{ log[4] if edit_mode else '' }}" required>
            </div>

            <div class="form-group">
                <label for="log_date">Workout Date</label>
                <input type="date" id="log_date" name="log_date" value="{{ log[5] if edit_mode else '' }}" required>
            </div>

            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4">{{ log[6] if edit_mode else '' }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if edit_mode %}Save Changes{% else %}Add Workout{% endif %}</button>
            <a href="{{ url_for('logs') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
